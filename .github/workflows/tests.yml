name: Tests and Code Quality

on:
  push:
  pull_request:
  workflow_dispatch:

  # Run automatically every day at 12:00 UTC
  schedule:
    - cron: "0 12 * * *"

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Black formatting
        run: black --check analysis.py exploratory_data_analysis.py tests

      - name: Run Flake8
        run: flake8 analysis.py exploratory_data_analysis.py tests

      - name: Check Python syntax
        run: python -m compileall analysis.py exploratory_data_analysis.py tests

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -v